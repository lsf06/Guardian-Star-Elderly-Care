<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" width="680" height="404" font-family="'Noto Sans SC','Microsoft YaHei',-apple-system,Segoe UI,sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="20" y="26" font-size="13.5" font-weight="700" fill="#1f2328">一次「异常静默」事件的完整生命周期</text>
  <text x="20" y="42" font-size="9.5" fill="#6b7280">同一个事件：只问 1 次、只推 1 次；人重新出现或门开才解锁</text>

  <!-- 左侧行标签 -->
  <text x="40" y="72" font-size="9.5" fill="#4b5563">雷达帧</text>

  <!-- 雷达帧行：60 格，x 从 40 起，步长 9.6，宽 8 -->
  <g>
    <!-- 有人（前 6 格） -->
    <g fill="#2563eb">
      <rect x="40" y="80" width="8" height="20" rx="1.5"/>
      <rect x="49.6" y="80" width="8" height="20" rx="1.5"/>
      <rect x="59.2" y="80" width="8" height="20" rx="1.5"/>
      <rect x="68.8" y="80" width="8" height="20" rx="1.5"/>
      <rect x="78.4" y="80" width="8" height="20" rx="1.5"/>
      <rect x="88" y="80" width="8" height="20" rx="1.5"/>
    </g>
    <!-- 无人：全部灰，中间插几格杂散帧 -->
    <g fill="#e2e6ec">
      <rect x="97.6" y="80" width="8" height="20" rx="1.5"/>
      <rect x="107.2" y="80" width="8" height="20" rx="1.5"/>
      <rect x="116.8" y="80" width="8" height="20" rx="1.5"/>
      <rect x="126.4" y="80" width="8" height="20" rx="1.5"/>
      <rect x="136" y="80" width="8" height="20" rx="1.5"/>
      <rect x="145.6" y="80" width="8" height="20" rx="1.5"/>
      <rect x="155.2" y="80" width="8" height="20" rx="1.5"/>
      <rect x="164.8" y="80" width="8" height="20" rx="1.5"/>
      <rect x="174.4" y="80" width="8" height="20" rx="1.5"/>
      <rect x="184" y="80" width="8" height="20" rx="1.5"/>
      <rect x="193.6" y="80" width="8" height="20" rx="1.5"/>
      <rect x="203.2" y="80" width="8" height="20" rx="1.5"/>
      <rect x="212.8" y="80" width="8" height="20" rx="1.5"/>
      <rect x="222.4" y="80" width="8" height="20" rx="1.5"/>
      <rect x="232" y="80" width="8" height="20" rx="1.5"/>
      <rect x="241.6" y="80" width="8" height="20" rx="1.5"/>
      <rect x="251.2" y="80" width="8" height="20" rx="1.5"/>
      <rect x="260.8" y="80" width="8" height="20" rx="1.5"/>
      <rect x="270.4" y="80" width="8" height="20" rx="1.5"/>
      <rect x="280" y="80" width="8" height="20" rx="1.5"/>
      <rect x="289.6" y="80" width="8" height="20" rx="1.5"/>
      <rect x="299.2" y="80" width="8" height="20" rx="1.5"/>
      <rect x="308.8" y="80" width="8" height="20" rx="1.5"/>
      <rect x="318.4" y="80" width="8" height="20" rx="1.5"/>
      <rect x="328" y="80" width="8" height="20" rx="1.5"/>
      <rect x="337.6" y="80" width="8" height="20" rx="1.5"/>
      <rect x="347.2" y="80" width="8" height="20" rx="1.5"/>
      <rect x="356.8" y="80" width="8" height="20" rx="1.5"/>
      <rect x="366.4" y="80" width="8" height="20" rx="1.5"/>
      <rect x="376" y="80" width="8" height="20" rx="1.5"/>
      <rect x="385.6" y="80" width="8" height="20" rx="1.5"/>
      <rect x="395.2" y="80" width="8" height="20" rx="1.5"/>
      <rect x="404.8" y="80" width="8" height="20" rx="1.5"/>
      <rect x="414.4" y="80" width="8" height="20" rx="1.5"/>
      <rect x="424" y="80" width="8" height="20" rx="1.5"/>
      <rect x="433.6" y="80" width="8" height="20" rx="1.5"/>
      <rect x="443.2" y="80" width="8" height="20" rx="1.5"/>
      <rect x="452.8" y="80" width="8" height="20" rx="1.5"/>
      <rect x="462.4" y="80" width="8" height="20" rx="1.5"/>
      <rect x="472" y="80" width="8" height="20" rx="1.5"/>
      <rect x="481.6" y="80" width="8" height="20" rx="1.5"/>
      <rect x="491.2" y="80" width="8" height="20" rx="1.5"/>
      <rect x="500.8" y="80" width="8" height="20" rx="1.5"/>
      <rect x="510.4" y="80" width="8" height="20" rx="1.5"/>
      <rect x="520" y="80" width="8" height="20" rx="1.5"/>
      <rect x="529.6" y="80" width="8" height="20" rx="1.5"/>
      <rect x="539.2" y="80" width="8" height="20" rx="1.5"/>
      <rect x="548.8" y="80" width="8" height="20" rx="1.5"/>
      <rect x="558.4" y="80" width="8" height="20" rx="1.5"/>
      <rect x="568" y="80" width="8" height="20" rx="1.5"/>
      <rect x="577.6" y="80" width="8" height="20" rx="1.5"/>
      <rect x="587.2" y="80" width="8" height="20" rx="1.5"/>
      <rect x="596.8" y="80" width="8" height="20" rx="1.5"/>
    </g>
    <!-- 杂散帧（真实的 8% 误检，单帧判定会被它们永久打断） -->
    <g fill="#93b4f5">
      <rect x="155.2" y="80" width="8" height="20" rx="1.5"/>
      <rect x="241.6" y="80" width="8" height="20" rx="1.5"/>
      <rect x="337.6" y="80" width="8" height="20" rx="1.5"/>
      <rect x="433.6" y="80" width="8" height="20" rx="1.5"/>
      <rect x="529.6" y="80" width="8" height="20" rx="1.5"/>
    </g>
  </g>

  <!-- 图例（帧行右下） -->
  <g font-size="8.5" fill="#6b7280">
    <rect x="468" y="60" width="8" height="8" rx="1.5" fill="#2563eb"/>
    <text x="480" y="68">看到人</text>
    <rect x="518" y="60" width="8" height="8" rx="1.5" fill="#e2e6ec"/>
    <text x="530" y="68">看不到</text>
    <rect x="568" y="60" width="8" height="8" rx="1.5" fill="#93b4f5"/>
    <text x="580" y="68">杂散帧</text>
  </g>

  <!-- T 阈值括号 -->
  <path d="M100 130 L100 124 L217 124 L217 130" fill="none" stroke="#e1a23c" stroke-width="1.4"/>
  <text x="158" y="119" font-size="9" fill="#a16207" text-anchor="middle">静默阈值 T = 90 s</text>

  <!-- 时间轴 -->
  <line x1="40" y1="150" x2="648" y2="150" stroke="#9aa4b2" stroke-width="1.2"/>
  <path d="M648 150 L642 147 L642 153 Z" fill="#9aa4b2"/>

  <!-- 事件竖线 -->
  <g stroke-width="1.2">
    <line x1="100" y1="100" x2="100" y2="150" stroke="#4b5563"/>
    <line x1="217" y1="100" x2="217" y2="150" stroke="#e1a23c"/>
    <line x1="256" y1="100" x2="256" y2="150" stroke="#d94b4b"/>
    <line x1="490" y1="100" x2="490" y2="150" stroke="#2f9e63"/>
  </g>
  <g>
    <circle cx="100" cy="150" r="3.2" fill="#4b5563"/>
    <circle cx="217" cy="150" r="3.2" fill="#e1a23c"/>
    <circle cx="256" cy="150" r="3.2" fill="#d94b4b"/>
    <circle cx="490" cy="150" r="3.2" fill="#2f9e63"/>
  </g>

  <!-- 事件标签 -->
  <g font-size="9" fill="#1f2328">
    <text x="104" y="172">t=0 人最后一次出现</text>
    <text x="221" y="172">t=90 开口问候</text>
    <text x="260" y="194">t=120 没回应 → 推送家属（1 次）</text>
    <text x="494" y="194">锁存，不再重复</text>
  </g>
  <g stroke="#cbd2da" stroke-width="0.8">
    <line x1="104" y1="164" x2="104" y2="156"/>
    <line x1="221" y1="164" x2="221" y2="156"/>
    <line x1="260" y1="186" x2="260" y2="176"/>
    <line x1="494" y1="186" x2="494" y2="176"/>
  </g>

  <!-- 状态带 -->
  <text x="40" y="232" font-size="9.5" fill="#4b5563">状态机</text>
  <g font-size="9">
    <rect x="40" y="240" width="177" height="26" rx="4" fill="#eafaf1" stroke="#2f9e63" stroke-width="1"/>
    <text x="48" y="257" fill="#14532d">ARMED　正常监测</text>

    <rect x="217" y="240" width="39" height="26" rx="4" fill="#fff7e6" stroke="#e1a23c" stroke-width="1"/>
    <text x="236" y="257" fill="#a16207" text-anchor="middle">ASK</text>

    <rect x="256" y="240" width="240" height="26" rx="4" fill="#fdeeee" stroke="#d94b4b" stroke-width="1"/>
    <text x="264" y="257" fill="#7f1d1d">ESCALATED　30 s 无回应 → 推送 1 次，锁存</text>

    <rect x="496" y="240" width="144" height="26" rx="4" fill="#eafaf1" stroke="#2f9e63" stroke-width="1"/>
    <text x="504" y="257" fill="#14532d">重见人 / 门开 → 解锁</text>
  </g>

  <!-- 门磁否决 -->
  <g>
    <rect x="40" y="286" width="600" height="30" rx="4" fill="#f6f7f9" stroke="#cbd2da" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="52" y="305" font-size="9" fill="#374151">门磁否决：若这段时间内门开过 ≥ 30 s → 判为离家，整条链路不启动（离场误问候必须为 0）</text>
  </g>

  <!-- 底部注记 -->
  <line x1="20" y1="330" x2="660" y2="330" stroke="#e5e7eb" stroke-width="1"/>
  <text x="20" y="348" font-size="9.5" font-weight="700" fill="#b91c1c">判定看的是「窗口内无人帧占比 ≤ 20%」，不是「连续 N 秒没有帧」</text>
  <text x="20" y="364" font-size="9.5" fill="#4b5563">上面那 5 个浅蓝杂散帧，会让「连续静默」永远无法达成 —— 实测中只要 8% 的杂散帧就能让检出率归零。</text>
  <text x="20" y="380" font-size="9.5" fill="#4b5563">改用窗口占比后，杂散帧只影响占比几个百分点，不影响结论。这一条是本项目在工程上真正踩过的坑。</text>
  <text x="20" y="396" font-size="9.5" fill="#6b7280">横轴非等比：0–90 s 段被压缩显示，实际 T 在 15–180 s 之间由 sweep.py 扫描选定工作点。</text>
</svg>
